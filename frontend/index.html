<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <!-- 🆕 홈 화면에 앱처럼 설치 (PWA). 아이폰은 이걸 해야 공지 알림을 받을 수 있다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DOTCI" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="DOTCI · 점 하나, 이야기 하나. 캠퍼스 장소에 도착하면 선배가 남긴 쪽지가 열려요" />
    <title>DOTCI</title>
    <!-- 링크를 카톡 등에 보냈을 때 뜨는 미리보기 (Open Graph). 이미지 주소는 전체 주소여야 한다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DOTCI" />
    <meta property="og:title" content="DOTCI · 점 하나, 이야기 하나." />
    <meta property="og:description" content="캠퍼스 장소에 도착하면 선배가 남긴 쪽지가 열려요" />
    <meta property="og:url" content="https://dotci.vercel.app/" />
    <meta property="og:image" content="https://dotci.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 기본 글꼴: 화면에 쓰인 글자만 골라 받는 방식(dynamic subset)이라 가볍다 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
